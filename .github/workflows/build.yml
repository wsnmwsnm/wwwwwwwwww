name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-11-jdk \
          python3-pip \
          python3-dev \
          python3-venv \
          libffi-dev \
          libssl-dev \
          libncurses5-dev \
          libsqlite3-dev \
          libreadline-dev \
          libbz2-dev \
          libgdbm-dev \
          zlib1g-dev \
          liblzma-dev \
          tk-dev
        
    - name: Install Buildozer
      run: |
        pip3 install --upgrade pip
        pip3 install buildozer cython virtualenv
        pip3 install kivy plyer python-dateutil
        
    - name: Setup Android SDK
      run: |
        export ANDROID_HOME="$HOME/android-sdk"
        export PATH="$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH"
        
    - name: Create assets directory
      run: |
        mkdir -p assets
        for file in a b c d e; do
          echo "placeholder for $file" > assets/$file
        done
        convert -size 512x512 xc:white assets/icon.png 2>/dev/null || echo "ImageMagick not available, using fallback"
        
    - name: Build APK
      run: |
        buildozer android debug
        ls -la bin/
        
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: GameMod-APK
        path: bin/*.apk
        retention-days: 7